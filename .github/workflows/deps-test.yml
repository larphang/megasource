name: Build LÖVE
on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Checkout LÖVE
      uses: actions/checkout@v4
      with:
        path: libs/love
        repository: love2d/love
        ref: main
    - name: Configure
      shell: cmd
      run: cmake -S . -B build -A x64
    - name: Build
      shell: cmd
      run: cmake --build build --config Release --target love --parallel 2
    - name: Upload Windows x64 build
      uses: actions/upload-artifact@v4
      with:
        name: love-windows-x64
        path: build/love/Release/*
        if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Checkout LÖVE
      uses: actions/checkout@v4
      with:
        path: libs/love
        repository: love2d/love
        ref: main
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release --target love --parallel 2
    - name: Upload macOS build
      uses: actions/upload-artifact@v4
      with:
        name: love-macos
        path: build/love/love
        if-no-files-found: error
